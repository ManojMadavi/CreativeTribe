    <script>
        function loginUser() {
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;

            // Retrieve registered users from local storage or database
            var registeredUsers = JSON.parse(localStorage.getItem('users')) || [];

            // Check if the entered credentials match any registered user
            var user = registeredUsers.find(function(user) {
                return user.username === username && user.password === password;
            });

            if (user) {
                alert('Login successful! Redirecting to home page...');
                window.location.href = 'home.html'; // Redirect to home page
            } else {
                alert('Invalid username or password. Please try again.'); // Show error message
            }
        }
    </script>
